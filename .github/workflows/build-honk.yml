name: Build honk IPK

on:
  workflow_dispatch:
    inputs:
      honk_tag:
        description: 'honk 版本（留空=自动取最新）'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: honk-ipk
  cancel-in-progress: true

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 查询 honk 最新版本
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT="${{ github.event.inputs.honk_tag }}"
          if [ -n "$INPUT" ]; then
            TAG="$INPUT"
            echo "手动指定: $TAG"
          else
            # honk 的 release 全部标记为 prerelease，/releases/latest 返回空
            # 所以用 /releases 列表取第一个正式版本号
            TAG=$(gh api "repos/daeuniverse/honk/releases?per_page=30" 2>/dev/null \
              | grep -oE '"tag_name"[[:space:]]*:[[:space:]]*"v[0-9]+[.][0-9]+[.][0-9]+(-beta[.][0-9]+)?"' \
              | head -1 \
              | sed 's/.*"\(v[^"]*\)".*/\1/')
            if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
              echo "::warning::API 查询失败，回退到 git tag"
              TAG=$(git ls-remote --tags --refs https://github.com/daeuniverse/honk.git 2>/dev/null \
                | sed 's|.*refs/tags/||' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' \
                | sort -V | tail -1)
            fi
            [ -z "$TAG" ] && { echo "::error::无法获取 honk 版本"; exit 1; }
            echo "GitHub 最新: $TAG"
          fi
          VER=$(echo "$TAG" | sed -E 's/^v//' | sed -E 's/-beta\.([0-9]+)$/_beta\1/')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "ver=$VER" >> $GITHUB_OUTPUT
          echo "包版本: $VER"

      - name: 检查是否已有该版本
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="honk-${{ steps.ver.outputs.ver }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "$TAG 已存在，跳过"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "需要编译 $TAG"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 安装依赖
        if: steps.check.outputs.exists == 'false'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set +e
          sudo -E apt-get update
          sudo -E apt-get install -y build-essential gcc-multilib g++-multilib git \
            libncurses5-dev libncursesw5-dev zlib1g-dev gawk flex bison unzip wget \
            curl rsync python3 python3-setuptools python3-pyelftools libssl-dev \
            libelf-dev patch pkg-config file subversion zstd
          sudo -E apt-get clean
          exit 0

      - name: 下载 SDK
        if: steps.check.outputs.exists == 'false'
        run: |
          set -e
          BASE="https://downloads.immortalwrt.org/snapshots/targets/mediatek/filogic"
          echo "查询 $BASE ..."
          curl -fsSL --max-time 60 "$BASE/" -o /tmp/idx.html 2>/dev/null || echo "索引获取失败"

          # SDK 文件名形如 immortalwrt-sdk-mediatek-filogic_gcc-14.4.0_musl.Linux-x86_64.tar.zst
          # 注意：SDK 是 x86_64 主机的交叉工具链，文件名里没有 aarch64
          SDK_URL=$(grep -oE '"immortalwrt-sdk-[^"]*\.tar\.zst"' /tmp/idx.html 2>/dev/null \
            | tr -d '"' | head -1)

          if [ -z "$SDK_URL" ]; then
            echo "::warning::ImmortalWrt SDK 未找到，改用 openwrt"
            BASE="https://downloads.openwrt.org/snapshots/targets/mediatek/filogic"
            curl -fsSL --max-time 60 "$BASE/" -o /tmp/idx.html 2>/dev/null
            SDK_URL=$(grep -oE '"openwrt-sdk-[^"]*\.tar\.zst"' /tmp/idx.html 2>/dev/null \
              | tr -d '"' | head -1)
          fi

          if [ -z "$SDK_URL" ]; then
            echo "当前索引内容:"
            grep -oE 'href="[^"]*"' /tmp/idx.html 2>/dev/null | head -30
            echo "::error::找不到 SDK"
            exit 1
          fi

          echo "SDK: $BASE/$SDK_URL"
          wget -q --timeout=300 "$BASE/$SDK_URL" -O sdk.tar.zst
          ls -lh sdk.tar.zst
          tar --use-compress-program=unzstd -xf sdk.tar.zst
          SDK_DIR=$(ls -d *sdk* | head -1)
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
          echo "解压: $SDK_DIR"

      - name: 安装 Rust
        if: steps.check.outputs.exists == 'false'
        run: |
          set +e
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          . "$HOME/.cargo/env"
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 aarch64-unknown-linux-musl
          rustup toolchain install nightly-2026-10-20 --profile minimal --component rust-src --component llvm-tools
          rustup target add --toolchain nightly-2026-10-20 aarch64-unknown-linux-musl
          rustup default 1.99.1

          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 --max-time 180 \
            "https://github.com/aya-rs/bpf-linker/releases/download/v0.13.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst" \
            -o /tmp/bl.tar.zst 2>/dev/null
          tar --use-compress-program=unzstd -xf /tmp/bl.tar.zst -C "$HOME/.local/bin" 2>/dev/null
          chmod +x "$HOME/.local/bin/bpf-linker" 2>/dev/null
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          rustup toolchain list
          "$HOME/.local/bin/bpf-linker" --version 2>&1 | head -1
          exit 0

      - name: 准备 honk 包
        if: steps.check.outputs.exists == 'false'
        run: |
          set -e
          cd "$SDK_DIR"
          echo "当前目录: $PWD"

          grep -q daepkgs feeds.conf.default || \
            echo 'src-git daepkgs https://github.com/daeuniverse/openwrt-packages.git;main' >> feeds.conf.default

          ./scripts/feeds update daepkgs
          ./scripts/feeds install honk

          HONK_PKG=""
          for d in feeds/daepkgs/honk package/feeds/daepkgs/honk; do
            [ -d "$d" ] && HONK_PKG="$d" && break
          done
          [ -z "$HONK_PKG" ] && HONK_PKG=$(find . -maxdepth 4 -type d -name honk -path '*dae*' 2>/dev/null | head -1)
          [ -n "$HONK_PKG" ] || { echo "::error::找不到 honk 包"; exit 1; }
          echo "honk 包: $HONK_PKG"

          TAG="${{ steps.ver.outputs.tag }}"
          VER="${{ steps.ver.outputs.ver }}"
          echo "版本: $TAG -> $VER"
          sed -i "s|HONK_VERSION),.*)|HONK_VERSION),${VER})|" "$HONK_PKG/Makefile" || true
          sed -i "s|HONK_GIT_TAG),v[^)]*)|HONK_GIT_TAG),${TAG})|" "$HONK_PKG/Makefile" || true
          grep -E 'HONK_VERSION|HONK_GIT_TAG' "$HONK_PKG/Makefile" | head -3

          # 去掉 vmlinux-btf 依赖：
          # vmlinux-btf 要求外面传 VMLINUX_BTF_SRC（BTF blob），SDK 里没有，
          # 直接 make 会报 "vmlinux-btf failed to build"。
          # 我们的路由器内核自带 BTF（/sys/kernel/btf/vmlinux 存在），
          # 装的是 vmlinux-btf-builtin，所以不需要这个包。
          echo "去掉 vmlinux-btf 依赖"
          sed -i 's/ +vmlinux-btf / /' "$HONK_PKG/Makefile"
          grep -E 'DEPENDS' "$HONK_PKG/Makefile" | head -3

          rm -rf "$HONK_PKG/src"
          git clone --depth 1 --branch "$TAG" https://github.com/daeuniverse/honk "$HONK_PKG/src"
          [ -f "$HONK_PKG/src/Cargo.toml" ] || { echo "::error::源码缺 Cargo.toml"; exit 1; }
          du -sh "$HONK_PKG/src"

          {
            echo "CONFIG_PACKAGE_honk=y"
            echo "CONFIG_PACKAGE_vmlinux-btf-builtin=y"
            echo "CONFIG_BUILDBOT=y"
            echo "CONFIG_KERNEL_DEBUG_INFO=y"
            echo "# CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set"
            echo "CONFIG_KERNEL_DEBUG_INFO_BTF=y"
          } > .config
          cat .config
          make defconfig

      - name: 编译
        if: steps.check.outputs.exists == 'false'
        run: |
          cd "$SDK_DIR"
          echo "开始编译 honk ($(nproc) 线程)..."
          make package/honk/compile -j$(nproc) 2>&1 | tail -120

      - name: 收集 ipk
        id: collect
        if: steps.check.outputs.exists == 'false'
        run: |
          cd "$SDK_DIR"
          echo "搜索 ipk:"
          find bin -name '*.ipk' 2>/dev/null | head -20
          IPK=$(find bin -name 'honk*.ipk' 2>/dev/null | head -1)
          if [ -z "$IPK" ]; then
            echo "::error::未生成 honk ipk"
            find bin -name '*.ipk' 2>/dev/null | head -20
            exit 1
          fi
          echo "找到: $IPK"
          mkdir -p /tmp/out
          cp "$IPK" /tmp/out/
          ls -lh /tmp/out/
          echo "ok=true" >> $GITHUB_OUTPUT

      - name: 发布 Release
        if: steps.collect.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="honk-${{ steps.ver.outputs.ver }}"
          {
            echo "honk for aarch64_cortex-a53 (CMCC RAX3000M)"
            echo ""
            echo "安装:"
            echo '```'
            echo "opkg install --force-reinstall /tmp/honk_*.ipk"
            echo "/etc/init.d/honk restart"
            echo '```'
          } > /tmp/notes.md
          gh release create "$TAG" /tmp/out/*.ipk \
            --repo "${{ github.repository }}" \
            --title "honk ${{ steps.ver.outputs.tag }}" \
            --notes-file /tmp/notes.md \
            || gh release upload "$TAG" /tmp/out/*.ipk --clobber

      - name: 清理旧 Release
        if: steps.collect.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ALL=$(gh release list --repo "${{ github.repository }}" --limit 50 \
            --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' 2>/dev/null \
            | grep '^honk-' || true)
          [ -z "$ALL" ] && exit 0
          TOTAL=$(echo "$ALL" | wc -l)
          echo "共 $TOTAL 个，保留 3 个"
          [ "$TOTAL" -le 3 ] && exit 0
          echo "$ALL" | tail -n +4 | while read -r t; do
            [ -n "$t" ] || continue
            echo "删除 $t"
            gh release delete "$t" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          done
